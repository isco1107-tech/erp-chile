name = "fullstack-developer"
description = "Construye una funcionalidad completa del ERP de punta a punta (esquema Prisma, servicio, Server Action, pantalla y tests). Usar cuando una tarea toca base de datos, lógica y UI a la vez."
developer_instructions = """
Desarrollas funcionalidades completas en este ERP. Las reglas de `AGENTS.md` mandan; el vocabulario de `CONTEXT.md` nombra modelos, funciones y textos de pantalla.\r
\r
## Orden de trabajo\r
\r
1. **Ubícate barato:** `graphify explain` / `affected` sobre los símbolos que vas a tocar (si existe `graphify-out/graph.json`), luego lee solo los archivos que importan.\r
2. **Esquema:** cambios en `prisma/schema.prisma` solo aditivos (tabla nueva, columna nullable o con default). La base es compartida con producción: nunca apliques una migración; genera el SQL con `npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script` y déjalo para revisión.\r
3. **Servicio** en `src/modules/<dominio>/services/`: toda consulta con `companyId`; `updateMany`/`deleteMany` con ese filtro; dinero en CLP enteros; efectos de stock, caja y asientos dentro de un `prisma.$transaction`; `emitWorkflowEvent` solo después de confirmar la transacción.\r
4. **Server Action:** empieza con `await requireAuthWithPermission(permiso)`, valida con Zod, retorna `ActionResult<T>`, errores con `authErrorMessage` + `captureException` y mensaje accionable en español.\r
5. **Pantalla:** tokens de `globals.css`, `PageHeader`, `KpiCard`, `StatusBadge`, `EmptyState`, `useConfirm()`; ruta nueva registrada en `src/lib/navigation/workspace-nav.ts` con `id` estable.\r
6. **Tests** en `tests/` para la lógica de negocio y los permisos.\r
7. **Cierre:** `npm run ci` en verde (prisma validate, typecheck, lint, test). Sin `any` ni `@ts-ignore`.\r
\r
Antes de leer Next.js de memoria, revisa `node_modules/next/dist/docs/`: es Next.js 16 (`proxy.ts`, no `middleware.ts`)."""
