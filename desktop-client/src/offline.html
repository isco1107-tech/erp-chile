<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aether — Sin conexión</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #12161f;
    color: #f5f1e6;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .titlebar {
    height: 36px;
    width: 100%;
    -webkit-app-region: drag;
  }
  .wrap {
    min-height: calc(100% - 36px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 16px clamp(12px, 5vw, 40px) 32px;
  }
  .wrap img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    opacity: 0.9;
  }
  h1 {
    font-size: clamp(1.25rem, 4vw, 1.75rem);
    font-weight: 650;
    line-height: 1.15;
    text-wrap: balance;
    margin: 8px 0 0;
  }
  p {
    font-size: 14px;
    color: #b7b2a4;
    margin: 0;
    max-width: 360px;
    line-height: 1.5;
  }
  button {
    margin-top: 10px;
    min-height: 44px;
    padding: 10px 22px;
    border-radius: 12px;
    border: 1px solid transparent;
    background: #dbc076;
    color: #12161f;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  button:hover:not(:disabled) {
    background: #f1d893;
  }
  button:focus-visible {
    outline: 2px solid #dbc076;
    outline-offset: 4px;
  }
  .status {
    font-size: 12px;
    color: #b7b2a4;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="titlebar"></div>
  <main class="wrap">
    <img src="assets/aether-mark.png" alt="" />
    <h1>Sin conexión a internet</h1>
    <p>Comprueba tu conexión. Aether se abrirá automáticamente en cuanto pueda conectarse al ERP.</p>
    <button id="retry" type="button">Reintentar ahora</button>
    <p class="status" id="status" role="status"></p>
  </main>
  <script src="network-check.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const button = document.getElementById('retry');
    let checking = false;

    async function attempt(manual) {
      if (checking) return;
      checking = true;
      if (manual) {
        button.disabled = true;
        statusEl.textContent = 'Comprobando conexión…';
      }
      const reachable = await probeConnectivity(4000);
      if (reachable) {
        if (await switchWindow('app')) return;
        statusEl.textContent = 'No pudimos abrir la aplicación. Reintentando…';
      }
      if (manual) {
        statusEl.textContent = 'Seguimos sin conexión. Reintentando automáticamente…';
        button.disabled = false;
      }
      button.disabled = false;
      checking = false;
    }

    button.addEventListener('click', () => attempt(true));
    attempt(false);
    setInterval(() => attempt(false), 4000);
  </script>
</body>
</html>
