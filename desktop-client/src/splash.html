<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aether</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #12161f;
    color: #f5f1e6;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }
  .splash {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .splash img {
    width: 84px;
    height: 84px;
    object-fit: contain;
    opacity: 0;
    animation: fade-in 0.5s ease forwards;
  }
  .splash .brand {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #dbc076;
    opacity: 0;
    animation: fade-in 0.5s ease 0.15s forwards;
  }
  .spinner {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(219, 192, 118, 0.25);
    border-top-color: #dbc076;
    opacity: 0;
    animation: fade-in 0.5s ease 0.3s forwards, spin 0.9s linear infinite;
  }
  @keyframes fade-in {
    to { opacity: 1; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="splash">
    <img src="assets/aether-mark.png" alt="Aether" />
    <div class="brand">Aether</div>
    <div class="spinner"></div>
  </div>
  <script src="network-check.js"></script>
  <script>
    (async function () {
      const reachable = await probeConnectivity(6000);
      await switchWindow(reachable ? 'app' : 'offline');
    })();
  </script>
</body>
</html>
