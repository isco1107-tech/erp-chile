name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # OP-11 / UX-14: la app compilada contra una base PostgreSQL nueva, levantada
  # solo con las migraciones. Si alguien vuelve a cambiar el esquema con
  # `prisma db push` sin migración, el paso de drift lo detiene acá.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: erp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d erp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base efímera del job y secretos de prueba: nada de esto existe fuera del CI.
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/erp_e2e
      JWT_SECRET: solo-para-ci-e2e-no-es-un-secreto-real-0123456789
      SEED_ADMIN_PASSWORD: Ci-E2e-Prueba-2026!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migraciones desde cero
        run: npx prisma migrate deploy

      - name: Sin drift entre migraciones y schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed
        run: npx tsx prisma/seed.ts

      - name: Build
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
