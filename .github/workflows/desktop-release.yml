name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edición del instalador
        type: choice
        options: [erp, pos]
        default: erp
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: windows
            path: desktop-client/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundle: appimage
            artifact: linux
            path: desktop-client/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-14
            bundle: dmg
            artifact: macos-arm64
            path: desktop-client/src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            bundle: dmg
            artifact: macos-x64
            path: desktop-client/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-client/src-tauri -> target
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
        working-directory: desktop-client
      - name: Verify native shell
        if: runner.os == 'Windows'
        working-directory: desktop-client/src-tauri
        run: cargo test --locked --lib --features pos
      - name: Build installer
        shell: bash
        run: |
          if [[ "$AETHER_EDITION" == "pos" ]]; then
            npm run build:pos -- --bundles "$AETHER_BUNDLE"
          else
            npm run tauri -- build --bundles "$AETHER_BUNDLE"
          fi
        working-directory: desktop-client
        env:
          NO_STRIP: 'true'
          AETHER_EDITION: ${{ inputs.edition }}
          AETHER_BUNDLE: ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: aether-${{ inputs.edition }}-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7
