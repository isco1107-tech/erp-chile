name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches: ['codex/desktop-release-*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: windows
            path: desktop-client/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundle: appimage
            artifact: linux
            path: desktop-client/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-14
            bundle: dmg
            artifact: macos-arm64
            path: desktop-client/src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            bundle: dmg
            artifact: macos-x64
            path: desktop-client/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-client/src-tauri -> target
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
        working-directory: desktop-client
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }}
        working-directory: desktop-client
        env:
          NO_STRIP: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7
